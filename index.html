<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Équipe UX UI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#F9FAFB;--surface:#FFFFFF;--surface2:#F2F4F6;
  --border:rgba(0,0,0,0.07);--border-md:rgba(0,0,0,0.12);
  --text:#1F2937;--text2:#4B5563;--text3:#9AA3AF;
  --today:#EF4444;
  --ovalt:#0A5F6B;
  --purple-bg:#EDE9FE;--purple-b:#7C3AED;--purple-t:#4C1D95;
  --teal-bg:#CCFBF1;--teal-b:#0D9488;--teal-t:#0F766E;
  --amber-bg:#FEF9C3;--amber-b:#D97706;--amber-t:#713F12;
  --coral-bg:#FAECE7;--coral-b:#993C1D;--coral-t:#712B13;
  --blue-bg:#DBEAFE;--blue-b:#2563EB;--blue-t:#1E40AF;
  --green-bg:#DCFCE7;--green-b:#16A34A;--green-t:#14532D;
  --red-bg:#FEE2E2;--red-b:#DC2626;--red-t:#7F1D1D;
  --right-w:256px;
  --nav-h:50px;
  --sh:0 1px 3px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.04);
  --sh2:0 2px 8px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.04);
  --r:4px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111827;--surface:#1F2937;--surface2:#374151;
  --border:rgba(255,255,255,0.08);--border-md:rgba(255,255,255,0.14);
  --text:#F9FAFB;--text2:#D1D5DB;--text3:#6B7280;--today:#F87171;
  --ovalt:#14B8A6;
  --purple-bg:#4C1D95;--purple-b:#A78BFA;--purple-t:#DDD6FE;
  --teal-bg:#0F766E;--teal-b:#2DD4BF;--teal-t:#CCFBF1;
  --amber-bg:#713F12;--amber-b:#FCD34D;--amber-t:#FEF9C3;
  --coral-bg:#7F1D1D;--coral-b:#F87171;--coral-t:#FEE2E2;
  --blue-bg:#1E40AF;--blue-b:#60A5FA;--blue-t:#DBEAFE;
  --green-bg:#14532D;--green-b:#4ADE80;--green-t:#DCFCE7;
  --red-bg:#7F1D1D;--red-b:#F87171;--red-t:#FEE2E2;
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;min-height:100vh;margin:0;-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;display:flex;flex-direction:column;}
#app-inner{min-height:100vh;display:flex;flex-direction:column;}

/* ── PAGE LAYOUT ── */
.page{display:block;min-height:100vh;}
.left-col{padding:20px 24px;overflow-y:auto;min-width:0;overflow-x:hidden;}
.right-col{background:var(--surface);border-left:0.5px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;}
.right-header{padding:18px 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.right-team-block{background:var(--bg);border-bottom:0.5px solid var(--border);padding:12px 14px;flex-shrink:0;}
.right-proj-block{flex:1;overflow-y:auto;padding:12px 14px;min-height:0;}
.right-proj-block::-webkit-scrollbar{width:3px;}
.right-proj-block::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:2px;}
.right-proj-block::-webkit-scrollbar{width:4px;}
.right-proj-block::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:2px;}

/* ── LEFT: HEADER ── */
.page-title{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--text);line-height:1.1;}
.page-sub{font-size:13px;color:var(--purple-t);font-weight:500;margin-top:2px;margin-bottom:20px;}

/* ── METEO + KPI ROW ── */
.top-row{display:flex;gap:10px;margin-bottom:16px;align-items:stretch;width:100%;}
.meteo-card{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r,4px);padding:12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:90px;cursor:pointer;transition:box-shadow .15s;}
.meteo-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.07);}
.meteo-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}
.meteo-icon{font-size:36px;line-height:1;}
.meteo-status{font-size:11px;color:var(--text2);margin-top:6px;text-align:center;}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1;min-width:0;}
.kpi{background:var(--surface);border-radius:var(--r,4px);box-shadow:var(--sh);padding:12px 14px;}
.kpi-label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin-bottom:4px;}
.kpi-value{font-size:20px;font-weight:700;letter-spacing:-.02em;color:var(--text);}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:2px;}
.kpi-bar{height:3px;border-radius:2px;background:var(--border-md);margin-top:8px;overflow:hidden;}
.kpi-bar-fill{height:100%;border-radius:2px;}
.kpi-value.warn{color:var(--red-t);} .kpi-value.ok{color:var(--teal-t);} .kpi-value.info{color:var(--blue-t);}

/* ── SECTION HEADERS ── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.section-title{font-size:16px;font-weight:700;letter-spacing:-.01em;color:var(--text);}
.btn{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r,4px);padding:6px 12px;font-size:12px;cursor:pointer;border:0.5px solid var(--border-md);background:var(--surface);color:var(--text2);transition:background .15s;white-space:nowrap;}
.btn:hover{background:var(--surface2);}
.btn.primary{background:var(--blue-bg);color:var(--blue-t);border-color:var(--blue-b);font-weight:500;}
.btn.danger{color:var(--red-t);border-color:var(--red-b);}
.btn.sm{padding:4px 8px;font-size:11px;}

/* ── GANTT ── */
.gantt-card{background:var(--surface);border-radius:var(--r,4px);box-shadow:var(--sh);padding:14px 14px 10px;margin-bottom:16px;overflow-x:auto;width:100%;}
.months-row{display:flex;margin-left:120px;margin-bottom:6px;}
.weeks-row{display:flex;margin-left:140px;margin-bottom:5px;}
.month-cell{flex:1;text-align:center;font-size:10px;font-weight:600;color:var(--text3);letter-spacing:.06em;text-transform:uppercase;}
.week-cell{flex:1;text-align:center;font-size:9px;color:var(--text3);}
.phase-lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);padding:7px 0 3px;border-top:0.5px solid var(--border);margin-top:2px;}
.phase-lbl:first-of-type{border-top:none;margin-top:0;}
.g-lane,.d-lane{display:flex;align-items:center;min-height:34px;margin-bottom:2px;}
.g-lbl{width:120px;min-width:120px;font-size:11px;color:var(--text2);padding-right:10px;text-align:right;cursor:pointer;line-height:1.3;}
.g-lbl:hover{color:var(--text);}
.d-lbl{width:140px;min-width:140px;font-size:11px;color:var(--text2);padding-right:10px;text-align:right;line-height:1.3;}
.g-track,.d-track{flex:1;position:relative;height:34px;}
.today-line{position:absolute;top:0;bottom:0;width:1.5px;background:var(--today);opacity:.55;z-index:3;pointer-events:none;}
.g-bar,.d-bar{position:absolute;height:24px;top:5px;border-radius:var(--r,4px);display:flex;align-items:center;padding:0 8px;font-size:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-width:1px;border-style:solid;transition:filter .15s,transform .1s;}
.g-bar:hover,.d-bar:hover{filter:brightness(1.07);transform:translateY(-1px);}
.d-bar.late{border-style:dashed!important;}
.ms-dot{position:absolute;top:8px;width:16px;height:16px;border-radius:50%;z-index:4;border:1.5px solid transparent;}
.ms-lbl{position:absolute;top:26px;font-size:9px;white-space:nowrap;color:var(--text3);transform:translateX(-50%);left:8px;font-weight:500;}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);padding:7px 0 3px;border-top:0.5px solid var(--border);margin-top:2px;}
.sec-lbl:first-of-type{border-top:none;margin-top:0;}

/* ── RIGHT SIDEBAR ── */
.right-title{font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--text);}
.right-section-title{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;}

/* TEAM */
.team-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;max-height:200px;overflow:hidden;position:relative;}
.team-grid.expanded{max-height:none;}
.team-chip{display:flex;align-items:center;gap:7px;background:var(--surface);border-radius:var(--r,4px);padding:7px 9px;cursor:pointer;transition:background .15s;border:0.5px solid var(--border);}
.team-chip:hover{background:var(--surface2);}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.av-md{width:28px;height:28px;font-size:10px;}
.av-sm{width:22px;height:22px;font-size:8px;}
.chip-info{line-height:1.3;min-width:0;}
.chip-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chip-role{font-size:10px;color:var(--text3);}
.chip-tasks{font-size:10px;color:var(--text2);}
.team-more{display:flex;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--text3);cursor:pointer;padding:6px 0 0;transition:color .15s;}
.team-more:hover{color:var(--text2);}

/* PROJECT CARDS RIGHT */
.rproj-card{background:var(--surface);border-radius:var(--r,4px);box-shadow:var(--sh);padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:box-shadow .15s,transform .1s;}
.rproj-card:hover{transform:translateY(-1px);box-shadow:0 2px 10px rgba(0,0,0,.07);}
.rproj-card.active{border-color:var(--blue-b);background:var(--blue-bg);}
.rproj-name{font-size:13px;font-weight:600;color:var(--text);}
.rproj-meta{font-size:10px;color:var(--text3);margin-top:2px;}
.rproj-row{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.badge{display:inline-flex;align-items:center;padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-width:1px;border-style:solid;}
.rproj-prog{display:flex;align-items:center;gap:6px;margin-top:6px;}
.prog-bar{flex:1;height:3px;border-radius:2px;background:var(--border-md);overflow:hidden;}
.prog-fill{height:100%;border-radius:2px;}
.prog-pct{font-size:10px;color:var(--text3);min-width:24px;text-align:right;}
.rproj-avatars{display:flex;gap:3px;margin-top:6px;}
.warn-tag{font-size:10px;color:var(--red-t);margin-top:4px;}
.add-proj-btn{display:flex;align-items:center;justify-content:center;gap:6px;border:0.5px dashed var(--border-md);border-radius:var(--r,4px);padding:10px;font-size:12px;color:var(--text3);cursor:pointer;transition:background .15s;margin-bottom:8px;}
.add-proj-btn:hover{background:var(--surface2);color:var(--text2);}

/* ── DETAIL VIEW ── */
.detail-back{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3);cursor:pointer;margin-bottom:16px;}
.detail-back:hover{color:var(--text);}
.detail-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;}
.detail-meta{font-size:12px;color:var(--text2);margin-bottom:20px;}
.d-kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px;}

/* TABS */
.tabs{display:flex;gap:2px;background:var(--surface2);border-radius:var(--r,4px);padding:3px;margin-bottom:18px;width:fit-content;}
.tab{padding:6px 14px;border-radius:var(--r,4px);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;transition:background .15s;}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08);}

/* TASK TABLE */
.task-table{background:var(--surface);border-radius:var(--r,4px);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px;}
.task-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .15s;}
.task-row:last-child{border-bottom:none;}
.task-row:hover{background:var(--surface2);}
.task-check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;}
.task-check.done{background:var(--teal-b);border-color:var(--teal-b);color:#fff;}
.task-check.late{border-color:var(--red-b);}
.task-name{flex:1;font-size:13px;color:var(--text);}
.task-name.done-text{text-decoration:line-through;color:var(--text3);}
.task-phase{font-size:10px;padding:2px 6px;border-radius:4px;border-width:1px;border-style:solid;}
.task-assignee{font-size:11px;color:var(--text3);}
.task-dates{font-size:10px;color:var(--text3);white-space:nowrap;}
.task-cost{font-size:11px;color:var(--text2);white-space:nowrap;}
.task-late{font-size:10px;color:var(--red-t);}
.task-comment-count{font-size:10px;color:var(--text3);display:flex;align-items:center;gap:3px;}
.task-priority{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* COMMENTS */
.comments-wrap{padding:10px 14px;}
.comment-item{display:flex;gap:8px;margin-bottom:10px;}
.comment-body{background:var(--surface2);border-radius:0 8px 8px 8px;padding:7px 10px;flex:1;}
.comment-author{font-size:10px;font-weight:600;color:var(--text2);margin-bottom:2px;}
.comment-text{font-size:12px;color:var(--text);}
.comment-date{font-size:10px;color:var(--text3);margin-top:3px;}
.comment-input-row{display:flex;gap:8px;margin-top:8px;}
.comment-input{flex:1;font-size:12px;padding:7px 10px;border-radius:var(--r,4px);border:0.5px solid var(--border-md);background:var(--bg);color:var(--text);}

/* DOCS */
.doc-list{padding:10px 14px;}
.doc-item{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:12px;}
.doc-item:last-child{border-bottom:none;}
.doc-icon{font-size:16px;}
.doc-name{flex:1;color:var(--text);}
.doc-link{font-size:11px;color:var(--blue-t);text-decoration:none;}
.doc-link:hover{text-decoration:underline;}

/* CR */
.cr-list{background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r,4px);overflow:hidden;margin-bottom:16px;}
.cr-item{padding:12px 14px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background .15s;}
.cr-item:last-child{border-bottom:none;}
.cr-item:hover{background:var(--surface2);}
.cr-title{font-size:13px;font-weight:500;color:var(--text);}
.cr-meta{font-size:11px;color:var(--text3);margin-top:2px;}
.cr-excerpt{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--surface);border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:3px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;font-size:13px;padding:6px 9px;border-radius:var(--r,4px);border:0.5px solid var(--border-md);background:var(--bg);color:var(--text);height:32px;}
.field textarea{height:80px;resize:vertical;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.modal-actions{display:flex;gap:7px;margin-top:14px;justify-content:flex-end;}
.color-picker{display:flex;gap:5px;flex-wrap:wrap;}
.color-opt{width:22px;height:22px;border-radius:5px;cursor:pointer;border:2px solid transparent;transition:transform .1s;}
.color-opt.sel{border-color:var(--text);transform:scale(1.15);}

/* RESPONSIVE */
@media (max-width:1280px){
  :root{--right-w:240px;}
  .left-col{padding:16px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .top-row{flex-wrap:wrap;}
  .meteo-card{min-width:80px;}
}
@media (max-width:1024px){
  :root{--right-w:220px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .months-row{margin-left:90px;}
  .g-lbl{width:90px;min-width:90px;}
  .d-kpi-row{grid-template-columns:repeat(3,1fr);}
}
/* PRINT / PRESENTATION MODE */
@media print{
  .right-col{display:none;}
  .left-col{padding:20px;}
  nav{display:none;}
  .gantt-card{page-break-inside:avoid;}
}

/* TOOLTIP */
.tooltip{position:fixed;background:var(--surface);border:0.5px solid var(--border-md);border-radius:var(--r,4px);padding:9px 13px;font-size:12px;color:var(--text);z-index:200;pointer-events:none;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:none;line-height:1.5;}
.tooltip strong{font-weight:600;display:block;margin-bottom:2px;}
.tooltip em{color:var(--text3);font-size:10px;display:block;margin-top:3px;font-style:normal;}

/* ÉQUIPER BUTTON */
.equip-btn{display:inline-flex;align-items:center;gap:5px;background:var(--amber-bg);color:var(--amber-t);border:0.5px solid var(--amber-b);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
<div class="page" id="app"></div>
<div class="tooltip" id="tooltip"></div>
<div id="modal-root"></div>

<script>
// ─── PALETTE ─────────────────────────────────────────────────────────────
const PAL={
  teal:  {bg:'var(--teal-bg)',  b:'var(--teal-b)',  t:'var(--teal-t)',  hex:'#0F6E56'},

  GESTION: {label:'Gestion',      color:'green'},
  VEILLE:  {label:'Veille',       color:'pink'},
};
const ROLES=['UX Lead','UX','Dev','Design','Produit'];
const PRIORITIES={high:{label:'Haute',color:'#D83A2A'},normal:{label:'Normale',color:'#BA7517'},low:{label:'Basse',color:'#9A9A94'}};

// ─── DB ──────────────────────────────────────────────────────────────────
function loadDB(){try{return JSON.parse(localStorage.getItem('uxui_v4')||'null');}catch(e){return null;}}

  projects:[
    {id:'bess',name:'BESS',lane:'Innovation',color:'purple',pole:'Industriel',budget:12000,
     startDate:'2026-01-01',endDate:'2026-12-31',note:'Battery Energy Storage System',actors:['etienne','ad'],

function buildGlobalGantt(){
  const wrap=document.createElement('div');
  const mrow=document.createElement('div');mrow.className='months-row';
  MONTHS.forEach(m=>{const mc=document.createElement('div');mc.className='month-cell';mc.textContent=m;mrow.appendChild(mc);});
  wrap.appendChild(mrow);
  const todayPct=((TODAY.getMonth()+TODAY.getDate()/31)/12)*100;
  const grouped={};DB.projects.forEach(p=>{if(!grouped[p.lane])grouped[p.lane]=[];grouped[p.lane].push(p);});
  let msR=false;
  LANE_ORDER.forEach(ln=>{
    if(!grouped[ln])return;
    const sl=document.createElement('div');sl.className='sec-lbl';sl.textContent=ln;wrap.appendChild(sl);
    grouped[ln].forEach(proj=>{
      const lane=document.createElement('div');lane.className='g-lane';
      const lbl=document.createElement('div');lbl.className='g-lbl';lbl.textContent=proj.name;
      lbl.onclick=()=>{state.view='detail';state.projId=proj.id;state.tab='steps';render();};
      lane.appendChild(lbl);
      const track=document.createElement('div');track.className='g-track';
      const tl=document.createElement('div');tl.className='today-line';tl.style.left=todayPct+'%';track.appendChild(tl);
      const s=new Date(proj.startDate),e=new Date(proj.endDate);
      const sM=s.getMonth()+(s.getDate()-1)/31,eM=e.getMonth()+(e.getDate())/31;
      const left=(sM/12)*100,width=((eM-sM)/12)*100;
      const p=PAL[proj.color]||PAL.teal;
      const bar=document.createElement('div');bar.className='g-bar';
      bar.style.cssText=`left:${Math.max(0,left)}%;width:${Math.min(width,100-Math.max(0,left))}%;background:${p.bg};border-color:${p.b};color:${p.t};`;
      if(projLate(proj))bar.style.borderStyle='dashed';
      bar.textContent=proj.name;
      bar.addEventListener('mouseenter',ev=>showTT(ev,`<strong>${proj.name}</strong>${proj.note||''}<em>${fmtDFull(proj.startDate)} → ${fmtDFull(proj.endDate)} · ${projProg(proj)}% fait</em>`));
      bar.addEventListener('mousemove',moveTT);bar.addEventListener('mouseleave',hideTT);
      bar.onclick=()=>{state.view='detail';state.projId=proj.id;state.tab='steps';render();};
      track.appendChild(bar);
      if(!msR){msR=true;DB.milestones.forEach(ms=>{const mp=PAL[ms.color]||PAL.teal;const mc=document.createElement('div');mc.className='ms-dot';mc.style.cssText=`left:calc(${((ms.month-0.5)/12)*100}% - 8px);background:${mp.bg};border-color:${mp.b};`;const ml=document.createElement('div');ml.className='ms-lbl';ml.textContent=ms.label;mc.appendChild(ml);track.appendChild(mc);});}
      lane.appendChild(track);wrap.appendChild(lane);
    });
  });
  return wrap;
}

function renderDetailTabs(proj,lc,tabs){
  // update tab active states
  tabs.querySelectorAll('.tab').forEach((t,i)=>{
    const ids=['steps','cr','docs'];t.classList.toggle('active',state.tab===ids[i]);
  });
  renderTabContent(proj);
}

function renderTabContent(proj){
  const tc=document.getElementById('tab-content');if(!tc)return;tc.innerHTML='';
  if(state.tab==='steps') renderStepsTab(proj,tc);
  else if(state.tab==='cr') renderCRTab(proj,tc);
  else if(state.tab==='docs') renderDocsTab(proj,tc);
}

function renderStepsTab(proj,container){
  const phases=['UX','UI','TEST','MEETING'];
  const grouped={};proj.steps.forEach(s=>{if(!grouped[s.phase])grouped[s.phase]=[];grouped[s.phase].push(s);});
  phases.forEach(ph=>{
    if(!grouped[ph])return;

function buildDetailGantt(proj){
  const wrap=document.createElement('div');
  const start=new Date(proj.startDate),end=new Date(proj.endDate);
  const totalDays=Math.max(1,dBetween(proj.startDate,proj.endDate));
  const numWeeks=Math.ceil(totalDays/7);const stepW=Math.max(1,Math.ceil(numWeeks/14));
  const wrow=document.createElement('div');wrow.className='weeks-row';
  for(let w=0;w<numWeeks;w+=stepW){const wd=new Date(start);wd.setDate(wd.getDate()+w*7);const mc=document.createElement('div');mc.className='week-cell';mc.textContent=wd.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});mc.style.flex=stepW;wrow.appendChild(mc);}
  wrap.appendChild(wrow);
  const todayPct=Math.max(0,Math.min(100,(dBetween(proj.startDate,TODAY.toISOString().slice(0,10))/totalDays)*100));
  const grouped={};proj.steps.forEach(s=>{if(!grouped[s.phase])grouped[s.phase]=[];grouped[s.phase].push(s);});
  ['UX','UI','TEST','MEETING'].forEach(ph=>{
    if(!grouped[ph])return;
    const pl=document.createElement('div');pl.className='phase-lbl';pl.textContent=(PHASES[ph]&&PHASES[ph].label)||ph;wrap.appendChild(pl);
    grouped[ph].forEach(step=>{
      const lane=document.createElement('div');lane.className='d-lane';
      const lbl=document.createElement('div');lbl.className='d-lbl';lbl.textContent=step.name;lane.appendChild(lbl);
      const track=document.createElement('div');track.className='d-track';
      const tl=document.createElement('div');tl.className='today-line';tl.style.left=todayPct+'%';track.appendChild(tl);
      const sD=dBetween(proj.startDate,step.startDate),eD=dBetween(proj.startDate,step.endDate);
      const left=(sD/totalDays)*100,width=(Math.max(1,eD-sD)/totalDays)*100;
      const sp=PAL[step.color]||PAL.teal;const late=isLate(step);
      const bar=document.createElement('div');bar.className='d-bar'+(late?' late':'');
      bar.style.cssText=`left:${Math.max(0,left)}%;width:${Math.min(Math.max(width,1),100-Math.max(0,left))}%;background:${step.done?'var(--surface2)':sp.bg};border-color:${late?'var(--red-b)':sp.b};color:${late?'var(--red-t)':step.done?'var(--text3)':sp.t};`;
      bar.innerHTML=step.done?`✓ ${step.name}`:`${step.name}${late?' ⚠':''}`;
      const a=actor(step.assignee);
      bar.addEventListener('mouseenter',ev=>showTT(ev,`<strong>${step.name}</strong>${a.name?`Assigné : ${a.name}`:''} ${late?'<span style="color:var(--red-t)">⚠ En retard</span>':step.done?'✓ Terminé':''}<em>${fmtDFull(step.startDate)} → ${fmtDFull(step.endDate)}${step.cost?` · ${step.cost.toLocaleString('fr-FR')}€`:''}</em>`));
      bar.addEventListener('mousemove',moveTT);bar.addEventListener('mouseleave',hideTT);
      bar.onclick=()=>openTaskDetail(proj.id,step.id);
      track.appendChild(bar);lane.appendChild(track);wrap.appendChild(lane);
    });
  });
  return wrap;
}

// ─── ACTOR VIEW ──────────────────────────────────────────────────────────
function renderActorView(aid){
  const a=actor(aid);const ap=PAL[a.color]||PAL.teal;
  const lc=document.getElementById('left-col');lc.innerHTML='';

  // Back
  const back=document.createElement('div');back.className='detail-back';
  back.innerHTML='← Tous les projets';
  back.onclick=()=>{state.view='global';state.projId=null;state.actorId=null;render();};
  lc.appendChild(back);

  // Title
  const titleRow=document.createElement('div');
  titleRow.style.cssText='display:flex;align-items:center;gap:12px;margin-bottom:6px;';
  titleRow.innerHTML=`<div class="avatar" style="width:40px;height:40px;font-size:14px;background:${ap.bg};color:${ap.t}">${a.name.slice(0,2).toUpperCase()}</div>
    <div><div class="detail-title" style="margin-bottom:0">${a.name}</div><div class="detail-meta" style="margin-bottom:0">${a.role}</div></div>`;
  lc.appendChild(titleRow);

  // Gather tasks
  const myTasks=DB.projects.flatMap(p=>p.steps.filter(s=>s.assignee===aid).map(s=>({...s,projName:p.name,projId:p.id})));
  const late=myTasks.filter(s=>isLate(s)).length;
  const done=myTasks.filter(s=>s.done).length;
  const cost=myTasks.reduce((s,t)=>s+(t.cost||0),0);
  const inProgress=myTasks.filter(s=>!s.done&&!isLate(s)).length;

  // KPIs
  const kpi=document.createElement('div');kpi.className='d-kpi-row';kpi.style.marginTop='16px';
  kpi.innerHTML=`
    <div class="kpi"><div class="kpi-label">Tâches totales</div><div class="kpi-value info">${myTasks.length}</div><div class="kpi-sub">sur ${DB.projects.length} projets</div></div>
    <div class="kpi"><div class="kpi-label">En cours</div><div class="kpi-value">${inProgress}</div><div class="kpi-sub">tâche${inProgress!==1?'s':''}</div></div>
    <div class="kpi"><div class="kpi-label">Terminées</div><div class="kpi-value ok">${done}</div><div class="kpi-sub">sur ${myTasks.length}</div><div class="kpi-bar"><div class="kpi-bar-fill" style="width:${myTasks.length?Math.round(done/myTasks.length*100):0}%;background:var(--teal-b)"></div></div></div>
    <div class="kpi"><div class="kpi-label">Retards</div><div class="kpi-value ${late?'warn':''}">${late}</div><div class="kpi-sub">tâche${late!==1?'s':''}</div></div>
    ${cost?`<div class="kpi"><div class="kpi-label">Coût total</div><div class="kpi-value">${cost.toLocaleString('fr-FR')}€</div></div>`:''}
  `;
  lc.appendChild(kpi);

  // ── Sub-tabs: Tâches / Heures ──────────────────────────────────────────
  const actorTab = state.actorTab || 'tasks';
  const subTabs = mkEl('div','display:flex;gap:2px;background:var(--surface2);border-radius:var(--r,4px);padding:3px;margin-top:16px;width:fit-content;');
  [['tasks','📋 Tâches'],['hours','⏱ Heures']].forEach(([id,label])=>{
    const t=mkEl('div','padding:6px 16px;border-radius:var(--r,4px);font-size:12px;font-weight:500;cursor:pointer;transition:background .15s;');
    t.textContent=label;
    if(actorTab===id){ t.style.background='var(--surface)'; t.style.color='var(--text)'; t.style.boxShadow='0 1px 4px rgba(0,0,0,.08)'; }
    else { t.style.color='var(--text2)'; }
    t.onclick=()=>{state.actorTab=id;renderActorView(aid);};
    subTabs.appendChild(t);
  });
  lc.appendChild(subTabs);

  if(actorTab==='hours'){
    renderActorHours(lc, aid);
    return;
  }

  if(!myTasks.length){
    const empty=document.createElement('div');
    empty.style.cssText='text-align:center;padding:48px;color:var(--text3);font-size:13px;background:var(--surface);border-radius:var(--r,4px);border:0.5px dashed var(--border-md);margin-top:16px;';
    empty.textContent='Aucune tâche assignée pour le moment.';
    lc.appendChild(empty);return;
  }

  // Tasks grouped by project
  const sh=document.createElement('div');sh.className='section-header';sh.style.marginTop='20px';
  sh.innerHTML=`<div class="section-title">Tâches de ${a.name}</div>`;lc.appendChild(sh);

  const byProj={};
  myTasks.forEach(t=>{if(!byProj[t.projId])byProj[t.projId]=[];byProj[t.projId].push(t);});

  Object.entries(byProj).forEach(([pid,tasks])=>{
    const proj=DB.projects.find(p=>p.id===pid);if(!proj)return;
    const pp=PAL[proj.color]||PAL.teal;

    // Project label
    const projLbl=document.createElement('div');
    projLbl.style.cssText='display:flex;align-items:center;gap:8px;margin:12px 0 6px;cursor:pointer;';
    projLbl.innerHTML=`<span class="badge" style="background:${pp.bg};border-color:${pp.b};color:${pp.t}">${proj.name}</span>
      <span style="font-size:11px;color:var(--text3)">${tasks.length} tâche${tasks.length!==1?'s':''}</span>`;
    projLbl.onclick=()=>{state.view='detail';state.projId=pid;state.tab='steps';render();};
    lc.appendChild(projLbl);

    const table=document.createElement('div');table.className='task-table';
    tasks.forEach(step=>{
      const late2=isLate(step);const sp=PAL[step.color]||PAL.teal;
      const pr=({high:{color:'#D83A2A'},normal:{color:'#BA7517'},low:{color:'#9A9A94'}})[step.priority||'normal'];
      const row=document.createElement('div');row.className='task-row';
      row.innerHTML=`
        <div class="task-check${step.done?' done':late2?' late':''}">${step.done?'✓':''}</div>
        <div class="task-priority" style="background:${pr.color}"></div>
        <div class="task-name${step.done?' done-text':''}">${step.name}</div>
        <span class="task-phase" style="background:${sp.bg};border-color:${sp.b};color:${sp.t}">${(PHASES[step.phase]||{label:step.phase}).label}</span>
        <div class="task-dates">${fmtD(step.startDate)} → ${fmtD(step.endDate)}</div>
        ${step.cost?`<div class="task-cost">${step.cost.toLocaleString('fr-FR')}€</div>`:''}
        ${late2?`<div class="task-late">⚠ Retard</div>`:''}
        <div class="task-comment-count">💬 ${(step.comments||[]).length}</div>
      `;
      row.onclick=()=>{state.view='detail';state.projId=pid;state.tab='steps';render();setTimeout(()=>openTaskDetail(pid,step.id),50);};
      table.appendChild(row);
    });
    lc.appendChild(table);
  });
}

function updateActorTaskOpts(aid){
  const projId=document.getElementById('ah-proj-'+aid).value;
  const sel=document.getElementById('ah-task-'+aid);
  sel.innerHTML='<option value="">— Tâche —</option>';
  if(!projId)return;
  const proj=DB.projects.find(p=>p.id===projId);
  if(!proj)return;
  proj.steps.forEach(s=>{const opt=document.createElement('option');opt.value=s.id;opt.textContent=s.name;sel.appendChild(opt);});
}

function addActorHourEntry(aid){
  const projId=document.getElementById('ah-proj-'+aid).value;
  const taskId=document.getElementById('ah-task-'+aid).value;
  const dur=parseFloat(document.getElementById('ah-dur-'+aid).value)||0;
  const date=document.getElementById('ah-date-'+aid).value;
  const note=document.getElementById('ah-note-'+aid).value.trim();
  const todayStr=TODAY.toISOString().slice(0,10);
  const twoWeeksAgo=new Date(TODAY);twoWeeksAgo.setDate(twoWeeksAgo.getDate()-14);
  const twoWeeksStr=twoWeeksAgo.toISOString().slice(0,10);
  if(!projId||dur<=0){showToast('Sélectionne un projet et une durée',true);return;}
  if(date<twoWeeksStr){showToast('Date trop ancienne — maximum 2 semaines en arrière',true);return;}
  if(date>todayStr){showToast('La date ne peut pas être dans le futur',true);return;}
  const proj=DB.projects.find(p=>p.id===projId);
  const step=proj&&taskId?proj.steps.find(s=>s.id===taskId):null;
  if(!DB.hours)DB.hours=[];
  DB.hours.push({id:'h'+uid(),actor:aid,projId,taskId,taskName:step?step.name:'Général',dur,date,note});
  document.getElementById('ah-note-'+aid).value='';
  document.getElementById('ah-dur-'+aid).value='1';
  saveDB();
  showToast('✅ '+dur+'h ajoutées sur '+(proj?proj.name:''));
  renderActorView(aid);
}

function copyDaySummaryForActor(aid,date){
  const entries=(DB.hours||[]).filter(h=>h.actor===aid&&h.date===date);
  if(!entries.length){showToast('Aucune saisie',true);return;}
  const a=actor(aid);
  const total=entries.reduce((s,h)=>s+h.dur,0);
  const dateLabel=new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const sep='─'.repeat(40);
  let lines=[dateLabel, sep, a.name+' ('+a.role+') — '+total+'h'];
  entries.forEach(h=>{
    const proj=DB.projects.find(p=>p.id===h.projId);
    lines.push('  • '+(proj?proj.name:'?')+' / '+h.taskName+' — '+h.dur+'h'+(h.note?' ('+h.note+')':''));
  });
  lines.push(sep);
  lines.push('Total : '+total+'h');
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('📋 Récap copié !'));
}

  const projOpts=DB.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');
  const actorOpts2=DB.actors.map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
  formCard.innerHTML=`
    <div style="font-size:13px;font-weight:600;color:var(--text);margin-bottom:14px;">+ Ajouter une saisie</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 80px 80px auto;gap:8px;align-items:end;flex-wrap:wrap;">
      <div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500;">Équipier</div>
        <select id="h-actor" style="width:100%;font-size:12px;padding:6px 8px;border-radius:var(--r,4px);border:0.5px solid var(--border-md);background:var(--bg);color:var(--text);height:32px;">${actorOpts2}</select>
      </div>
      <div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500;">Projet</div>
        <select id="h-proj" onchange="updateTaskOpts()" style="width:100%;font-size:12px;padding:6px 8px;border-radius:var(--r,4px);border:0.5px solid var(--border-md);background:var(--bg);color:var(--text);height:32px;"><option value="">— Projet —</option>${projOpts}</select>
      </div>
      <div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500;">Tâche</div>
        <select id="h-task" style="width:100%;font-size:12px;padding:6px 8px;border-radius:var(--r,4px);border:0.5px solid var(--border-md);background:var(--bg);color:var(--text);height:32px;"><option value="">— Tâche —</option></select>
      </div>
      <div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500;">Durée (h)</div>
        <input type="number" id="h-dur" min="0.25" max="24" step="0.25" value="1" style="width:100%;font-size:12px;padding:6px 8px;border-radius:var(--r,4px);border:0.5px solid var(--border-md);background:var(--bg);color:var(--text);height:32px;">
      </div>
      <div>
        <div style="font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500;">Date</div>
        <input type="date" id="h-date" value="${todayStr}" style="width:100%;font-size:12px;padding:6px 8px;border-radius:var(--r,4px);border:0.5px solid var(--border-md);background:var(--bg);color:var(--text);height:32px;">
      </div>
      <div style="padding-top:18px;">
        <button class="btn primary" style="height:32px;white-space:nowrap" onclick="addHourEntry()">Ajouter</button>
      </div>
    </div>
    <div style="margin-top:10px;">
      <div style="font-size:11px;color:var(--text3);margin-bottom:3px;font-weight:500;">Note (optionnel)</div>
      <input type="text" id="h-note" placeholder="ex: Finalisation maquette écran principal..." style="width:100%;font-size:12px;padding:6px 8px;border-radius:var(--r,4px);border:0.5px solid var(--border-md);background:var(--bg);color:var(--text);height:32px;">
    </div>`;
  lc.appendChild(formCard);

  // ── Today recap ───────────────────────────────────────────────────────
  const todayEntries=DB.hours.filter(h=>h.date===todayStr);
  const todayTotal=todayEntries.reduce((s,h)=>s+h.dur,0);

  const todayCard=mkEl('div','background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r,4px);padding:18px 20px;margin-bottom:16px;');
  const todayHdr=mkEl('div','display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;');
  todayHdr.innerHTML=`
    <div>
      <div style="font-size:14px;font-weight:600;color:var(--text)">Aujourd'hui — ${new Date(todayStr+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div>
      <div style="font-size:12px;color:var(--text3);margin-top:2px">${todayTotal}h saisies sur ${todayEntries.length} entrée${todayEntries.length!==1?'s':''}</div>
    </div>
    <button class="btn" style="font-size:11px;padding:4px 10px" onclick="copyDaySummary('${todayStr}')">📋 Copier récap</button>`;
  todayCard.appendChild(todayHdr);

  if(todayEntries.length){
    renderHourEntries(todayCard, todayEntries);
  } else {
    const empty=mkEl('div','text-align:center;padding:24px;color:var(--text3);font-size:13px;');
    empty.textContent="Aucune saisie aujourd'hui";
    todayCard.appendChild(empty);
  }
  lc.appendChild(todayCard);

  // ── Weekly recap ──────────────────────────────────────────────────────
  const weekStart=new Date(TODAY);
  weekStart.setDate(weekStart.getDate()-weekStart.getDay()+1);
  const weekEntries=DB.hours.filter(h=>{
    const d=new Date(h.date);return d>=weekStart&&d<=TODAY;
  });
  const weekTotal=weekEntries.reduce((s,h)=>s+h.dur,0);

  if(weekEntries.length){
    const weekCard=mkEl('div','background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r,4px);padding:18px 20px;margin-bottom:16px;');
    const weekHdr=mkEl('div','display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;');
    weekHdr.innerHTML=`
      <div>
        <div style="font-size:14px;font-weight:600;color:var(--text)">Cette semaine</div>
        <div style="font-size:12px;color:var(--text3);margin-top:2px">${weekTotal}h sur ${weekEntries.length} entrée${weekEntries.length!==1?'s':''}</div>
      </div>
      <button class="btn" style="font-size:11px;padding:4px 10px" onclick="copyWeekSummary()">📋 Copier récap semaine</button>`;
    weekCard.appendChild(weekHdr);

    // Group by actor then by project
    const byActor={};
    weekEntries.forEach(h=>{if(!byActor[h.actor])byActor[h.actor]=[];byActor[h.actor].push(h);});
    Object.entries(byActor).forEach(([aid,entries])=>{
      const a=actor(aid);const ap=PAL[a.color]||PAL.teal;
      const aTotal=entries.reduce((s,h)=>s+h.dur,0);
      const aHdr=mkEl('div','display:flex;align-items:center;gap:8px;margin-bottom:8px;margin-top:8px;');
      aHdr.innerHTML=`<div class="avatar av-sm" style="background:${ap.bg};color:${ap.t}">${a.name.slice(0,2).toUpperCase()}</div>
        <span style="font-size:12px;font-weight:600;color:var(--text)">${a.name}</span>
        <span style="font-size:11px;color:var(--text3)">${aTotal}h</span>`;
      weekCard.appendChild(aHdr);

      // By project summary
      const byProj2={};
      entries.forEach(h=>{if(!byProj2[h.projId])byProj2[h.projId]=0;byProj2[h.projId]+=h.dur;});
      const projSummary=mkEl('div','display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;');
      Object.entries(byProj2).forEach(([pid,total])=>{
        const proj=DB.projects.find(p=>p.id===pid);if(!proj)return;
        const pp=PAL[proj.color]||PAL.teal;
        const chip=mkEl('div','');
        chip.innerHTML=`<span style="background:${pp.bg};border:0.5px solid ${pp.b};color:${pp.t};border-radius:5px;padding:2px 8px;font-size:11px">${proj.name} — ${total}h</span>`;
        projSummary.appendChild(chip);
      });
      weekCard.appendChild(projSummary);
    });
    lc.appendChild(weekCard);
  }

  // ── All entries history ───────────────────────────────────────────────
  if(DB.hours.length > todayEntries.length){
    const histCard=mkEl('div','background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r,4px);padding:18px 20px;');
    histCard.innerHTML=`<div style="font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px;">Historique <span style="font-size:12px;font-weight:400;color:var(--text3)">${DB.hours.length} entrées au total</span></div>`;

    // Group by date descending
    const byDate={};
    DB.hours.forEach(h=>{if(!byDate[h.date])byDate[h.date]=[];byDate[h.date].push(h);});
    Object.keys(byDate).sort((a,b)=>b.localeCompare(a)).slice(0,7).forEach(date=>{
      if(date===todayStr)return;
      const entries=byDate[date];
      const total=entries.reduce((s,h)=>s+h.dur,0);
      const dateHdr=mkEl('div','display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:0.5px solid var(--border);cursor:pointer;');
      dateHdr.innerHTML=`<div style="font-size:12px;font-weight:500;color:var(--text)">${new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'})}</div>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:11px;color:var(--text3)">${total}h · ${entries.length} entrée${entries.length!==1?'s':''}</span>
          <button class="btn sm" onclick="copyDaySummary('${date}');event.stopPropagation()">📋</button>
        </div>`;
      histCard.appendChild(dateHdr);
      renderHourEntries(histCard, entries, true);
    });
    lc.appendChild(histCard);
  }
}

function renderHourEntries(container, entries, compact=false){
  const table=mkEl('div','border-radius:var(--r,4px);overflow:hidden;');
  entries.sort((a,b)=>b.date.localeCompare(a.date)).forEach(h=>{
    const proj=DB.projects.find(p=>p.id===h.projId);
    const a=actor(h.actor);const ap=PAL[a.color]||PAL.teal;
    const pp=proj?PAL[proj.color]||PAL.teal:PAL.teal;
    const row=mkEl('div','display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:0.5px solid var(--border);');
    row.innerHTML=`
      <div class="avatar av-sm" style="background:${ap.bg};color:${ap.t}" title="${a.name}">${a.name.slice(0,2).toUpperCase()}</div>
      ${proj?`<span style="background:${pp.bg};border:0.5px solid ${pp.b};color:${pp.t};border-radius:4px;padding:1px 6px;font-size:10px;white-space:nowrap">${proj.name}</span>`:'<span style="font-size:10px;color:var(--text3)">Projet supprimé</span>'}
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.taskName||'—'}</div>
        ${h.note?`<div style="font-size:10px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${h.note}</div>`:''}
      </div>
      <div style="font-size:13px;font-weight:600;color:var(--text);white-space:nowrap">${h.dur}h</div>
      <div style="font-size:10px;color:var(--text3);cursor:pointer;padding:2px 6px;border-radius:4px;transition:background .1s;" onclick="deleteHourEntry('${h.id}')" title="Supprimer">×</div>`;
    table.appendChild(row);
  });
  container.appendChild(table);
}

function updateTaskOpts(){
  const projId=document.getElementById('h-proj').value;
  const sel=document.getElementById('h-task');
  sel.innerHTML='<option value="">— Tâche —</option>';
  if(!projId)return;
  const proj=DB.projects.find(p=>p.id===projId);
  if(!proj)return;
  proj.steps.forEach(s=>{
    const opt=document.createElement('option');
    opt.value=s.id;opt.textContent=s.name;sel.appendChild(opt);
  });
}

function addHourEntry(){
  const actor_id=document.getElementById('h-actor').value;
  const projId=document.getElementById('h-proj').value;
  const taskId=document.getElementById('h-task').value;
  const dur=parseFloat(document.getElementById('h-dur').value)||0;
  const date=document.getElementById('h-date').value;
  const note=document.getElementById('h-note').value.trim();
  if(!projId||dur<=0){showToast('⚠ Sélectionne un projet et une durée valide',true);return;}
  const proj=DB.projects.find(p=>p.id===projId);
  const step=proj&&taskId?proj.steps.find(s=>s.id===taskId):null;
  if(!DB.hours)DB.hours=[];
  DB.hours.push({
    id:'h'+uid(),actor:actor_id,projId,taskId,
    taskName:step?step.name:'Général',
    dur,date,note
  });
  document.getElementById('h-note').value='';
  document.getElementById('h-dur').value='1';
  saveDB();
  renderHoursView();
  showToast('✅ Saisie ajoutée — '+dur+'h sur '+(proj?proj.name:''));
}

function deleteHourEntry(id){
  DB.hours=(DB.hours||[]).filter(h=>h.id!==id);
  saveDB();renderHoursView();
}

function copyDaySummary(date){
  const entries=(DB.hours||[]).filter(h=>h.date===date);
  if(!entries.length){showToast('Aucune saisie ce jour',true);return;}
  const byActor={};
  entries.forEach(h=>{if(!byActor[h.actor])byActor[h.actor]=[];byActor[h.actor].push(h);});
  let text=`Saisie du ${new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}\n${'─'.repeat(40)}\n`;
  Object.entries(byActor).forEach(([aid,ents])=>{
    const a=actor(aid);
    const total=ents.reduce((s,h)=>s+h.dur,0);
    text+=`\n${a.name} (${a.role}) — ${total}h\n`;
    ents.forEach(h=>{
      const proj=DB.projects.find(p=>p.id===h.projId);
      text+=`  • ${proj?proj.name:'?'} / ${h.taskName} — ${h.dur}h${h.note?' ('+h.note+')':''}\n`;
    });
  });
  const total=entries.reduce((s,h)=>s+h.dur,0);
  text+=`\n${'─'.repeat(40)}\nTotal : ${total}h`;
  navigator.clipboard.writeText(text).then(()=>showToast('📋 Récap copié dans le presse-papier !'));
}

function copyWeekSummary(){
  const weekStart=new Date(TODAY);
  weekStart.setDate(weekStart.getDate()-weekStart.getDay()+1);
  const entries=(DB.hours||[]).filter(h=>{const d=new Date(h.date);return d>=weekStart&&d<=TODAY;});
  if(!entries.length){showToast('Aucune saisie cette semaine',true);return;}
  const byDay={};
  entries.forEach(h=>{if(!byDay[h.date])byDay[h.date]=[];byDay[h.date].push(h);});
  let text=`Récap semaine du ${weekStart.toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}\n${'═'.repeat(40)}\n`;
  Object.keys(byDay).sort().forEach(date=>{
    const dayEntries=byDay[date];
    const dayTotal=dayEntries.reduce((s,h)=>s+h.dur,0);
    text+=`\n${new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'short'})} — ${dayTotal}h\n`;
    dayEntries.forEach(h=>{
      const proj=DB.projects.find(p=>p.id===h.projId);const a=actor(h.actor);
      text+=`  ${a.name} · ${proj?proj.name:'?'} / ${h.taskName} — ${h.dur}h${h.note?' ('+h.note+')':''}\n`;
    });
  });
  const total=entries.reduce((s,h)=>s+h.dur,0);
  text+=`\n${'═'.repeat(40)}\nTotal semaine : ${total}h`;
  navigator.clipboard.writeText(text).then(()=>showToast('📋 Récap semaine copié !'));
}

// ─── DASHBOARD ───────────────────────────────────────────────────────────
function renderDashboard(){
  const lc=document.getElementById('left-col');lc.innerHTML='';
  lc.style.cssText='';

  // ── HELPERS ──────────────────────────────────────────────────────────
  const allSteps=DB.projects.flatMap(p=>p.steps.map(s=>({...s,proj:p})));
  const todayStr=TODAY.toISOString().slice(0,10);
  const in7=new Date(TODAY);in7.setDate(in7.getDate()+7);
  const in30=new Date(TODAY);in30.setDate(in30.getDate()+30);

  // Projets par pôle
  const byPole={Industriel:[],Céréalier:[],Transversal:[]};
  DB.projects.forEach(p=>{const pole=p.pole||'Transversal';if(byPole[pole])byPole[pole].push(p);else byPole['Transversal'].push(p);});

  // KPIs globaux
  const totalProjs=DB.projects.length;
  const lateProjs=DB.projects.filter(p=>projLate(p)).length;
  const deliveredProjs=DB.projects.filter(p=>p.steps.length&&p.steps.every(s=>s.done)).length;
  const allDone=allSteps.filter(s=>s.done).length;
  const allTotal=allSteps.length;
  const globalProg=allTotal?Math.round(allDone/allTotal*100):0;
  const onTimeProjs=DB.projects.filter(p=>!projLate(p)&&p.steps.length>0).length;
  const deliveryRate=totalProjs?Math.round(onTimeProjs/totalProjs*100):0;
  const totalBudget=DB.projects.reduce((s,p)=>s+(p.budget||0),0);
  const totalSpent=DB.projects.reduce((s,p)=>s+stepCost(p),0);
  const upcomingSteps=allSteps.filter(s=>!s.done&&new Date(s.endDate)<=in7&&new Date(s.endDate)>=TODAY);
  const lateSteps=allSteps.filter(s=>isLate(s));

  // ── SECTION : VUE ÉQUIPE ─────────────────────────────────────────────
  addDashSection(lc,'👥 Vue Équipe','Ce qui se passe maintenant');

  // Charge par personne
  const chargeRow=mkEl('div','display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px;');
  DB.actors.forEach(a=>{
    const ap=PAL[a.color]||PAL.teal;
    const mySteps=allSteps.filter(s=>s.assignee===a.id);
    const myLate=mySteps.filter(s=>isLate(s)).length;
    const myDone=mySteps.filter(s=>s.done).length;
    const myInProgress=mySteps.filter(s=>!s.done&&!isLate(s)).length;
    const myNext=mySteps.filter(s=>!s.done&&new Date(s.endDate)<=in7).length;
    const load=mySteps.length?Math.round(myInProgress/Math.max(1,DB.projects.length)*100):0;
    const card=mkEl('div','background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r,4px);padding:16px;');
    card.innerHTML=`
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="avatar" style="width:36px;height:36px;font-size:13px;background:${ap.bg};color:${ap.t}">${a.name.slice(0,2).toUpperCase()}</div>
        <div><div style="font-size:14px;font-weight:600">${a.name}</div><div style="font-size:11px;color:var(--text3)">${a.role}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div style="background:var(--surface2);border-radius:var(--r,4px);padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:var(--blue-t)">${myInProgress}</div>
          <div style="font-size:10px;color:var(--text3)">En cours</div>
        </div>
        <div style="background:var(--surface2);border-radius:var(--r,4px);padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:${myLate?'var(--red-t)':'var(--teal-t)'}">${myLate}</div>
          <div style="font-size:10px;color:var(--text3)">Retards</div>
        </div>
        <div style="background:var(--surface2);border-radius:var(--r,4px);padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:var(--teal-t)">${myDone}</div>
          <div style="font-size:10px;color:var(--text3)">Terminées</div>
        </div>
        <div style="background:var(--surface2);border-radius:var(--r,4px);padding:8px;text-align:center">
          <div style="font-size:20px;font-weight:700;color:${myNext?'var(--amber-t)':'var(--text3)'}">${myNext}</div>
          <div style="font-size:10px;color:var(--text3)">Cette semaine</div>
        </div>
      </div>`;
    chargeRow.appendChild(card);
  });
  lc.appendChild(chargeRow);

  // Tâches urgentes J+7
  if(upcomingSteps.length||lateSteps.length){
    const urgTitle=mkEl('div','font-size:13px;font-weight:600;color:var(--text2);margin-bottom:8px;display:flex;align-items:center;gap:6px;');
    urgTitle.innerHTML=`⏰ Alertes & échéances proches <span style="background:var(--red-bg);color:var(--red-t);border:0.5px solid var(--red-b);border-radius:5px;padding:1px 7px;font-size:11px">${lateSteps.length} retard${lateSteps.length!==1?'s':''}</span>`;
    lc.appendChild(urgTitle);
    const urgTable=mkEl('div','background:var(--surface);border:0.5px solid var(--border);border-radius:var(--r,4px);overflow:hidden;margin-bottom:20px;');
    const toShow=[...lateSteps,...upcomingSteps.filter(s=>!isLate(s))].slice(0,8);
    toShow.forEach(s=>{
      const late2=isLate(s);const a=actor(s.assignee);const ap=PAL[a.color]||PAL.teal;
      const row=mkEl('div','display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:0.5px solid var(--border);');

        <div style="width:8px;height:8px;border-radius:50%;background:${late2?'var(--red-b)':'var(--amber-b)'};flex-shrink:0"></div>
        <div style="flex:1;font-size:12px;color:var(--text)">${s.proj.name} — ${s.name}</div>
        <div class="avatar av-sm" style="background:${ap.bg};color:${ap.t}">${a.name.slice(0,2).toUpperCase()}</div>
        <div style="font-size:11px;color:${late2?'var(--red-t)':'var(--amber-t)'};white-space:nowrap">${late2?'⚠ Retard':'→ '+fmtD(s.endDate)}</div>`;
      row.style.cursor='pointer';row.onclick=()=>{state.view='detail';state.projId=s.proj.id;state.tab='steps';render();};
      urgTable.appendChild(row);
    });
    lc.appendChild(urgTable);
  }

  // ── SECTION : VUE PROJET ─────────────────────────────────────────────
  addDashSection(lc,'📋 Vue Projet','Pilotage par pôle');

  // Répartition par pôle
  const poleRow=mkEl('div','display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;');
  const poleColors={Industriel:'blue',Céréalier:'green',Transversal:'purple'};
  Object.entries(byPole).forEach(([pole,projs])=>{
    const cl=PAL[poleColors[pole]]||PAL.blue;
    const poleProgs=projs.map(p=>projProg(p));
    const avgProg=poleProgs.length?Math.round(poleProgs.reduce((a,b)=>a+b,0)/poleProgs.length):0;
    const poleLate=projs.filter(p=>projLate(p)).length;
    const poleBudget=projs.reduce((s,p)=>s+(p.budget||0),0);
    const poleSpent=projs.reduce((s,p)=>s+stepCost(p),0);

// ─── IMPORT EXCEL ────────────────────────────────────────────────────────
function importExcel(input) {
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const wb = XLSX.read(e.target.result, {type:'binary', cellDates:true});

      // ── Acteurs ──────────────────────────────────────────────────────
      if(wb.SheetNames.includes('Acteurs')) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Acteurs']);
        if(rows.length) {
          DB.actors = rows.map(r => ({
            id:     String(r['ID']||r['id']||uid()),
            name:   String(r['Nom']||r['name']||''),
            role:   String(r['Rôle']||r['role']||''),
            color:  String(r['Couleur']||r['color']||'teal'),
          })).filter(a => a.name);
        }
      }

      // ── Projets ──────────────────────────────────────────────────────
      if(wb.SheetNames.includes('Projets')) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Projets']);
        const existingById = {};
        DB.projects.forEach(p => existingById[p.id] = p);
        DB.projects = rows.map(r => {
          const id = String(r['ID']||r['id']||uid());
          const existing = existingById[id] || {};
          return {
            id,
            name:      String(r['Nom projet']||r['name']||''),
            lane:      String(r['Lane']||r['lane']||'Innovation'),
            color:     String(r['Couleur']||r['color']||'purple'),
            pole:      String(r['Pôle']||r['pole']||''),
            budget:    parseFloat(r['Budget (€)']||r['budget']||0)||0,
            startDate: fmtExcelDate(r['Date début']||r['startDate']),
            endDate:   fmtExcelDate(r['Date fin']||r['endDate']),
            note:      String(r['Note']||r['note']||''),
            actors:    String(r['Acteurs']||'').split(',').map(s=>s.trim()).filter(Boolean),
            steps:     existing.steps  || [],
            docs:      existing.docs   || [],
            crs:       existing.crs    || [],
          };
        }).filter(p => p.name);
      }

      // ── Taches ───────────────────────────────────────────────────────
      if(wb.SheetNames.includes('Taches')) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['Taches']);
        // Reset steps on all projects then re-fill
        DB.projects.forEach(p => p.steps = []);
        rows.forEach(r => {
          const projId = String(r['ID Projet']||r['projId']||'');
          const proj = DB.projects.find(p => p.id === projId);
          if(!proj) return;
          if(!proj.steps) proj.steps = [];
          proj.steps.push({
            id:        String(r['ID Tâche']||r['id']||'s'+uid()),
            phase:     String(r['Phase']||r['phase']||'UX'),
            name:      String(r['Nom tâche']||r['name']||''),
            color:     String(r['Couleur']||({UX:'teal',UI:'blue',TEST:'purple',MEETING:'amber',GESTION:'green',VEILLE:'pink'})[r['Phase']]||'teal'),
            startDate: fmtExcelDate(r['Date début']||r['startDate']),
            endDate:   fmtExcelDate(r['Date fin']||r['endDate']),
            assignee:  String(r['Assigné à']||r['assignee']||''),
            cost:      parseFloat(r['Coût (€)']||r['cost']||0)||0,
            priority:  String(r['Priorité']||r['priority']||'normal'),
            done:      String(r['Statut']||r['status']||'').toLowerCase().includes('termin'),
            comments:  [],
          });
        });
      }

      // ── CR ───────────────────────────────────────────────────────────
      if(wb.SheetNames.includes('CR')) {
        const rows = XLSX.utils.sheet_to_json(wb.Sheets['CR']);
        DB.projects.forEach(p => p.crs = []);
        rows.forEach(r => {
          const projId = String(r['ID Projet']||'');
          const proj = DB.projects.find(p => p.id === projId);
          if(!proj) return;
          if(!proj.crs) proj.crs = [];
          proj.crs.push({
            id:         String(r['ID CR']||'cr'+uid()),
            title:      String(r['Titre']||''),
            date:       fmtExcelDate(r['Date']||r['date']),
            attendees:  String(r['Participants']||'').split(',').map(s=>s.trim()).filter(Boolean),
            content:    String(r['Contenu / Actions']||r['content']||''),
          });
        });
      }

      saveDB();
      // Show year from filename
      const year = file.name.match(/\d{4}/)?.[0] || '';
      if(year) document.title = `Équipe UX UI — ${year}`;
      showToast(`✅ Importé : ${file.name} — ${DB.projects.length} projets, ${DB.actors.length} acteurs`);
      render();
    } catch(err) {
      showToast('❌ Erreur import : ' + err.message, true);
      console.error(err);
    }
    input.value = '';
  };
  reader.readAsBinaryString(file);
}

function fmtExcelDate(val) {
  if(!val) return '';
  if(val instanceof Date) return val.toISOString().slice(0,10);
  if(typeof val === 'string' && val.match(/^\d{4}-\d{2}-\d{2}/)) return val.slice(0,10);
  if(typeof val === 'number') {
    // Excel serial date
    const d = new Date((val - 25569) * 86400 * 1000);
    return d.toISOString().slice(0,10);
  }
  return String(val).slice(0,10);
}

// ─── EXPORT EXCEL ────────────────────────────────────────────────────────
function exportExcel() {
  const wb = XLSX.utils.book_new();

  // ── Acteurs ──────────────────────────────────────────────────────────
  const acteurs = DB.actors.map(a => ({
    'ID': a.id, 'Nom': a.name, 'Rôle': a.role, 'Couleur': a.color, 'Email': '', 'Note': ''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(acteurs), 'Acteurs');

  // ── Projets ──────────────────────────────────────────────────────────
  const projets = DB.projects.map(p => ({
    'ID': p.id, 'Nom projet': p.name, 'Lane': p.lane, 'Couleur': p.color,
    'Pôle': p.pole||'', 'Date début': p.startDate, 'Date fin': p.endDate,
    'Budget (€)': p.budget||'', 'Acteurs': (p.actors||[]).join(', '),
    'N° dossier': '', 'Statut': projProg(p)===100?'Livré':'En cours', 'Note': p.note||'', 'Tags': ''
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(projets), 'Projets');

  // ── Taches ───────────────────────────────────────────────────────────
  const taches = DB.projects.flatMap(p =>
    (p.steps||[]).map(s => ({
      'ID Tâche': s.id, 'ID Projet': p.id, 'Nom projet': p.name,
      'Phase': s.phase, 'Nom tâche': s.name, 'Assigné à': s.assignee||'',
      'Date début': s.startDate, 'Date fin': s.endDate,
      'Coût (€)': s.cost||'', 'Priorité': s.priority||'normal',
      'Statut': s.done ? 'Terminé' : isLate(s) ? 'En retard' : 'En cours',
      'Livrable': '', 'Validation': s.done?'Validé':'', 'Commentaire': (s.comments||[]).map(c=>c.author+': '+c.text).join(' | ')
    }))
  );
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(taches.length ? taches : [{}]), 'Taches');

  // ── CR ───────────────────────────────────────────────────────────────
  const crs = DB.projects.flatMap(p =>
    (p.crs||[]).map(cr => ({
      'ID CR': cr.id, 'ID Projet': p.id, 'Nom projet': p.name,
      'Date': cr.date, 'Titre': cr.title,
      'Participants': (cr.attendees||[]).join(', '),
      'Contenu / Actions': cr.content||'', 'Statut': 'Clôturé'
    }))
  );
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(crs.length ? crs : [{}]), 'CR');

  // ── Download ─────────────────────────────────────────────────────────
  const year = new Date().getFullYear();
  XLSX.writeFile(wb, `${year}_Projet.xlsx`);
  showToast(`💾 Exporté : ${year}_Projet.xlsx`);
}

// ─── TOAST NOTIFICATION ──────────────────────────────────────────────────
function showToast(msg, isError=false) {
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.cssText = `position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${isError?'var(--red-bg)':'var(--surface)'};color:${isError?'var(--red-t)':'var(--text)'};border:0.5px solid ${isError?'var(--red-b)':'var(--border-md)'};border-radius:var(--r,4px);padding:10px 20px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:500;transition:opacity .3s;`;
  t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; }, 3000);
}

async function syncFromSheets(){
  setSyncStatus('Chargement...','var(--blue-t)');
  try {
    // Use JSONP to bypass CORS
    const json = await new Promise((resolve, reject) => {
      const cbName = 'gsCb' + Math.floor(Math.random()*1000000);
      const script = document.createElement('script');
      const timeout = setTimeout(() => {
        delete window[cbName];
        document.body.removeChild(script);
        reject(new Error('Timeout'));
      }, 10000);
      window[cbName] = function(data) {
        clearTimeout(timeout);
        delete window[cbName];
        document.body.removeChild(script);
        resolve(data);
      };
      script.src = SHEETS_URL + '?action=read&callback=' + cbName;
      script.onerror = () => { clearTimeout(timeout); reject(new Error('Script error')); };
      document.body.appendChild(script);
    });
    if(!json.ok) throw new Error(json.error||'Erreur serveur');
    const data = json.data;

    // ── Acteurs ────────────────────────────────────────────────────────
    if(data.Acteurs && data.Acteurs.length>1){
      const headers=data.Acteurs[0];
      DB.actors=data.Acteurs.slice(1).map(row=>{
        const r={};headers.forEach((h,i)=>r[h]=row[i]);
        return {id:String(r['ID']||uid()),name:String(r['Nom']||''),role:String(r['Rôle']||''),color:String(r['Couleur']||'teal')};
      }).filter(a=>a.name);
    }

    // ── Projets ────────────────────────────────────────────────────────
    if(data.Projets && data.Projets.length>1){
      const headers=data.Projets[0];
      const existingSteps={};
      DB.projects.forEach(p=>existingSteps[p.id]=p);
      DB.projects=data.Projets.slice(1).map(row=>{
        const r={};headers.forEach((h,i)=>r[h]=row[i]);
        const id=String(r['ID']||uid());
        const ex=existingSteps[id]||{};
        return {
          id, name:String(r['Nom projet']||''), lane:String(r['Lane']||'Innovation'),
          color:String(r['Couleur']||'purple'), pole:String(r['Pôle']||''),
          budget:parseFloat(r['Budget (€)'])||0,
          startDate:String(r['Date début']||'').slice(0,10),
          endDate:String(r['Date fin']||'').slice(0,10),
          note:String(r['Note']||''), actors:String(r['Acteurs']||'').split(',').map(s=>s.trim()).filter(Boolean),
          steps:ex.steps||[], docs:ex.docs||[], crs:ex.crs||[]
        };
      }).filter(p=>p.name&&String(p.name).trim()&&p.name!=='Nom projet');
    }

    // ── Taches ─────────────────────────────────────────────────────────
    if(data.Taches && data.Taches.length>1){
      const headers=data.Taches[0];
      DB.projects.forEach(p=>p.steps=[]);
      data.Taches.slice(1).forEach(row=>{
        const r={};headers.forEach((h,i)=>r[h]=row[i]);
        const proj=DB.projects.find(p=>p.id===String(r['ID Projet']||''));
        if(!proj)return;
        proj.steps.push({
          id:String(r['ID Tâche']||'s'+uid()), phase:String(r['Phase']||'UX'),
          name:String(r['Nom tâche']||''),
          color:String(r['Couleur']||({UX:'teal',UI:'blue',TEST:'purple',MEETING:'amber',GESTION:'green',VEILLE:'pink'})[r['Phase']]||'teal'),
          startDate:String(r['Date début']||'').slice(0,10),
          endDate:String(r['Date fin']||'').slice(0,10),
          assignee:String(r['Assigné à']||''), cost:parseFloat(r['Coût (€)'])||0,
          priority:String(r['Priorité']||'normal'),
          done:String(r['Statut']||'').toLowerCase().includes('termin'),
          comments:[]
        });
      });
    }

    // ── CR ─────────────────────────────────────────────────────────────
    if(data.CR && data.CR.length>1){
      const headers=data.CR[0];
      DB.projects.forEach(p=>p.crs=[]);
      data.CR.slice(1).forEach(row=>{
        const r={};headers.forEach((h,i)=>r[h]=row[i]);
        const proj=DB.projects.find(p=>p.id===String(r['ID Projet']||''));
        if(!proj)return;
        if(!proj.crs)proj.crs=[];
        proj.crs.push({
          id:String(r['ID CR']||'cr'+uid()), title:String(r['Titre']||''),
          date:String(r['Date']||'').slice(0,10),
          attendees:String(r['Participants']||'').split(',').map(s=>s.trim()).filter(Boolean),
          content:String(r['Contenu / Actions']||'')
        });
      });
    }

    saveDB();
    setSyncStatus('Sync ✓','var(--teal-t)');
    showToast('☁️ Synchronisé depuis Google Sheets — '+DB.projects.length+' projets');
    render();
  } catch(err){
    setSyncStatus('Erreur','var(--red-t)');
    showToast('❌ Erreur sync : '+err.message, true);
    console.error(err);
  }
}

async function saveToSheets(){
  showToast('💾 Sauvegarde vers Google Sheets...');
  try {
    // Build sheets data
    const acteurs=[
      ['ID','Nom','Rôle','Couleur','Email','Note'],
      ...DB.actors.map(a=>[a.id||'',a.name||'',a.role||'',a.color||'','',''])
    ];
    const projets=[
      ['ID','Nom projet','Lane','Couleur','Pôle','Date début','Date fin','Budget (€)','Acteurs','N° dossier','Statut','Note','Tags'],
      ...DB.projects.map(p=>[
        p.id||'', p.name||'', p.lane||'', p.color||'', p.pole||'',
        p.startDate||'', p.endDate||'', p.budget||0,
        (p.actors||[]).join(', '), '',
        projProg(p)===100?'Livre':'En cours',
        p.note||'', ''
      ])
    ];
    const taches=[
      ['ID Tâche','ID Projet','Nom projet','Phase','Nom tâche','Assigné à','Date début','Date fin','Coût (€)','Priorité','Statut','Livrable','Validation','Commentaire'],
      ...DB.projects.flatMap(p=>(p.steps||[]).map(s=>[
        s.id||'', p.id||'', p.name||'', s.phase||'', s.name||'',
        s.assignee||'', s.startDate||'', s.endDate||'',
        s.cost||0, s.priority||'normal',
        s.done?'Terminé':isLate(s)?'En retard':'En cours',
        '', '', (s.comments||[]).map(c=>c.author+': '+c.text).join(' | ')
      ]))
    ];
    const crs=[
      ['ID CR','ID Projet','Nom projet','Date','Titre','Participants','Contenu / Actions','Statut'],
      ...DB.projects.flatMap(p=>(p.crs||[]).map(cr=>[
        cr.id||'', p.id||'', p.name||'', cr.date||'', cr.title||'',
        (cr.attendees||[]).join(', '), cr.content||'', 'Clôturé'
      ]))
    ];

    // Send via POST with JSON — Apps Script handles it
    const payload = JSON.stringify({
      action: 'write',
      Acteurs: acteurs,
      Projets: projets,
      Taches: taches,
      CR: crs
    });

    const url = SHEETS_URL + '?action=write&payload=' + encodeURIComponent(payload);
    const json = await new Promise((resolve, reject) => {
      const cbName = 'gsCb' + Math.floor(Math.random()*1000000);
      const script = document.createElement('script');
      const timeout = setTimeout(() => {
        delete window[cbName];
        if(document.body.contains(script)) document.body.removeChild(script);
        reject(new Error('Timeout'));
      }, 15000);
      window[cbName] = function(data) {
        clearTimeout(timeout);
        delete window[cbName];
        if(document.body.contains(script)) document.body.removeChild(script);
        resolve(data);
      };
      script.src = url + '&callback=' + cbName;
      script.onerror = () => { clearTimeout(timeout); reject(new Error('Script error')); };
      document.body.appendChild(script);
    });
    if(!json.ok) throw new Error(json.error || 'Erreur');
    showToast('✅ Sauvegardé dans Google Sheets !');
    setSyncStatus('Sync ✓','var(--teal-t)');
  } catch(err){
    showToast('❌ Erreur sauvegarde : '+err.message, true);
    console.error(err);
  }
}

// ─── IMPORT DEPUIS EXCEL DE TEMPS OVALT ──────────────────────────────────
function importFromTimeExcel(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'binary',cellDates:true});
      let imported=0;

      // Pôle par nom de feuille
      function guessPole(name){
        const n=name.toLowerCase();
        if(n.includes('yoplait')||n.includes('bridor')||n.includes('céréalier')||n.includes('cerealier')) return 'Céréalier';
        if(n.includes('industriel')||n.includes('indus')||n.includes('hutchinson')||n.includes('rakari')||n.includes('indusia')||n.includes('royal canin')||n.includes('cfia')||n.includes('bess')||n.includes('unither')||n.includes('puig')) return 'Industriel';
        return 'Transversal';
      }

      // Phase → catégorie outil
      function guessPhase(col){
        const c=(col||'').toLowerCase();
        if(c.includes('observ')) return 'UX';
        if(c.includes('analys')) return 'UX';
        if(c.includes('restit')) return 'UX';
        if(c.includes('prototyp')||c.includes('maquette')||c.includes('wireframe')||c.includes('ui')) return 'UI';
        if(c.includes('réunion')||c.includes('reunion')) return 'MEETING';
        if(c.includes('gestion')||c.includes('veille')) return 'GESTION';
        return 'UX';
      }

      function fmtDt(val){
        if(!val) return '';
        if(val instanceof Date){
          // Skip placeholder dates (2100)
          if(val.getFullYear()>=2100) return '';
          return val.toISOString().slice(0,10);
        }
        return '';
      }

      function tdToHours(val){
        if(!val) return 0;
        if(typeof val==='object'&&val.constructor&&val.constructor.name==='Decimal'){
          return Math.round(val*24*100)/100;
        }
        // timedelta stored as fraction of day in openpyxl, but here XLSX gives seconds
        if(typeof val==='number') return Math.round(val*24*10)/10;
        return 0;
      }

      wb.SheetNames.forEach(sheetName=>{
        const ws=wb.Sheets[sheetName];
        if(!ws) return;
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:false,dateNF:'yyyy-mm-dd'});
        if(!rows||rows.length<4) return;

        // Find n° affaire (row 0 or 1)
        let numAffaire='';
        for(let r=0;r<3;r++){
          const row=rows[r]||[];
          for(let c=0;c<row.length;c++){
            const v=String(row[c]||'');
            if(v.match(/n[^a-z]\s*\d+/i)||v.match(/^\d{5,}/)) { numAffaire=v.replace('None','').trim(); break; }
          }
          if(numAffaire) break;
        }

        // Find "Cat." row to get phase column headers
        let catRowIdx=-1;
        let phaseStartCol=3; // usually col D (index 3)
        for(let r=0;r<10;r++){
          const row=rows[r]||[];
          if(row.some(v=>String(v||'').includes('Cat.'))){
            catRowIdx=r; break;
          }
        }
        if(catRowIdx===-1) return;

        const catRow=rows[catRowIdx]||[];
        // Phase headers start at col 3
        const phases=[];
        for(let c=3;c<catRow.length;c++){
          const v=String(catRow[c]||'').trim();
          if(v&&v!=='RESTANT'&&v!=='TOTAL') phases.push({col:c,name:v,phase:guessPhase(v)});
        }
        if(!phases.length) return;

        // Find DEBUT and FIN rows
        let debutRow=null,finRow=null;
        for(let r=catRowIdx;r<Math.min(catRowIdx+8,rows.length);r++){
          const row=rows[r]||[];
          if(String(row[2]||'').trim()==='DEBUT') debutRow=row;
          if(String(row[2]||'').trim()==='FIN') finRow=row;
        }

        // Find livré status
        let isLivree=false;
        for(let r=0;r<5;r++){
          const row=rows[r]||[];
          if(row.some(v=>String(v||'').toLowerCase().includes('livr'))) { isLivree=true; break; }
        }

        // Determine project start/end
        let projStart='',projEnd='';
        phases.forEach(ph=>{
          const ds=debutRow?String(debutRow[ph.col]||''):'';
          const df=finRow?String(finRow[ph.col]||''):'';
          const startD=ds.slice(0,10);
          const endD=df.slice(0,10);
          if(startD&&startD.match(/^\d{4}-\d{2}-\d{2}/)&&startD.slice(0,4)<'2099'){
            if(!projStart||startD<projStart) projStart=startD;
          }
          if(endD&&endD.match(/^\d{4}-\d{2}-\d{2}/)&&endD.slice(0,4)<'2099'){
            if(!projEnd||endD>projEnd) projEnd=endD;
          }
        });
        if(!projStart) projStart=new Date().getFullYear()+'-01-01';
        if(!projEnd||projEnd.slice(0,4)>='2099') projEnd=new Date().getFullYear()+'-12-31';

        // Assign pole + lane
        const pole=guessPole(sheetName);
        const lane=pole==='Céréalier'?'Pôle Céréalier':pole==='Industriel'?'Pôle Industriel':'Transversal';
        const color=pole==='Céréalier'?'amber':pole==='Industriel'?'purple':'teal';

        // Build steps
        const steps=[];
        phases.forEach((ph,i)=>{
          const ds=debutRow?String(debutRow[ph.col]||''):'';
          const df=finRow?String(finRow[ph.col]||''):'';
          const startD=ds.slice(0,10).match(/^\d{4}-\d{2}-\d{2}/)?ds.slice(0,10):projStart;
          const rawEnd=df.slice(0,10);
          const endD=rawEnd.match(/^\d{4}-\d{2}-\d{2}/)&&rawEnd.slice(0,4)<'2099'?rawEnd:projEnd;
          const phColor={UX:'teal',UI:'blue',MEETING:'amber',GESTION:'green'}[ph.phase]||'teal';
          steps.push({
            id:'s'+uid(),phase:ph.phase,name:ph.name,color:phColor,
            startDate:startD,endDate:endD,
            assignee:'etienne',cost:0,priority:'normal',done:isLivree,comments:[]
          });
        });

        // Check if project already exists
        const existing=DB.projects.find(p=>p.name.toLowerCase()===sheetName.toLowerCase().trim());
        if(existing){
          // Update dates and steps if empty
          if(!existing.steps.length) existing.steps=steps;
          if(numAffaire&&!existing.note) existing.note=numAffaire;
          existing.pole=existing.pole||pole;
        } else {
          DB.projects.push({
            id:uid(),name:sheetName.trim(),lane,color,pole,
            budget:0,startDate:projStart,endDate:projEnd,
            note:numAffaire,actors:['etienne'],
            steps,docs:[],crs:[]
          });
          imported++;
        }
      });

      saveDB();
      showToast('✅ Importé depuis Excel de temps — '+imported+' nouveaux projets, '+(wb.SheetNames.length-imported)+' mis à jour');
      input.value='';
      render();
    }catch(err){
      showToast('❌ Erreur import : '+err.message,true);
      console.error(err);
      input.value='';
    }
  };
  reader.readAsBinaryString(file);
}
render();

function toggleMainMenu(){
  const m=document.getElementById('main-menu');
  if(m) m.style.display=m.style.display==='none'?'block':'none';
}
document.addEventListener('click',function(e){
  if(!e.target.closest('#main-menu')&&!e.target.closest('[onclick*="toggleMainMenu"]')){
    const m=document.getElementById('main-menu');
    if(m) m.style.display='none';
  }
});
